version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 20 && node --version
        - corepack enable
        - pnpm install --frozen-lockfile
    build:
      commands:
        - env | grep -e '^NUXT_' >> .env || true
        - pnpm build
        - |
          if [ -n "$NUXT_BACKEND_API_ORIGIN" ]; then
            sed -i.bak "s|http://127.0.0.1:8080|${NUXT_BACKEND_API_ORIGIN}|g" .amplify-hosting/compute/default/index.mjs
            rm -f .amplify-hosting/compute/default/index.mjs.bak
          fi
  artifacts:
    baseDirectory: .amplify-hosting
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .pnpm-store/**/*
